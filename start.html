<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceul Tehnologic ”Aurel Vlaicu” Galați</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Prevent double scrollbars */
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        #audio-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 0, 0, 0.9);
            /* Red background for visibility */
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 2147483647;
            /* Maximum Z-Index */
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border: 2px solid white;
        }

        #audio-controls:hover {
            background: rgba(200, 0, 0, 1);
            transform: scale(1.02);
        }

        #volume-slider {
            width: 100px;
            cursor: pointer;
            height: 5px;
        }
    </style>
</head>

<body>

    <!-- Main Content Frame -->
    <iframe src="index.html" name="mainFrame" title="Main Content"></iframe>

    <!-- Audio Player & Controls -->
    <div id="audio-controls">
        <i class="fas fa-play" id="play-icon"></i>
        <span id="control-text">Start Muzică</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
    </div>

    <audio id="bg-music" loop>
        <source src="media/background_music.mpeg" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        const audio = document.getElementById("bg-music");
        const controls = document.getElementById("audio-controls");
        const playIcon = document.getElementById("play-icon");
        const controlText = document.getElementById("control-text");
        const volumeSlider = document.getElementById("volume-slider");
        let isPlaying = false;

        // Try autoplay on load (might be blocked)
        window.addEventListener('load', function () {
            audio.volume = 0.5;
            // Many browsers block autoplay with sound. We try anyway.
            var promise = audio.play();
            if (promise !== undefined) {
                promise.then(_ => {
                    isPlaying = true;
                    updateUI();
                }).catch(error => {
                    // Autoplay was prevented. User needs to click.
                    console.log("Autoplay prevented");
                    isPlaying = false;
                    updateUI();
                });
            }
        });

        controls.addEventListener("click", function (e) {
            // Prevent toggling when clicking the slider
            if (e.target === volumeSlider) return;

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updateUI();
        });

        volumeSlider.addEventListener("input", function () {
            audio.volume = this.value;
        });

        function updateUI() {
            if (isPlaying) {
                playIcon.className = "fas fa-stop";
                controlText.textContent = "Stop";
            } else {
                playIcon.className = "fas fa-play";
                controlText.textContent = "Start";
            }
        }

        // Listen for messages from iframes to pause/play music
        window.addEventListener('message', function (event) {
            if (event.data === 'pauseMusic') {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    updateUI();
                }
            } else if (event.data === 'playMusic') {
                // Optional: Resume music when video stops? 
                // Users might find auto-resume annoying if they paused it manually.
                // Let's leave it as manual resume or auto resume if it was playing?
                // For now, let's just handle pause to solve the conflict.
                // If we want to be smart:
                // if (!isPlaying) { audio.play(); isPlaying = true; updateUI(); }
            }
        });
    </script>

</body>

</html>
